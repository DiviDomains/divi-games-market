<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="DiviGames">
  <!-- DiviGames monogram: a D and a G interlocked like two chain links. Each letter is cut where it
       passes under the other: the D under the G at the top, the G under the D at the lower left. -->
  <defs>
    <linearGradient id="dg-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#e3172e"/>
      <stop offset="1" stop-color="#ff4f9e"/>
    </linearGradient>
    <mask id="dg-under-d" maskUnits="userSpaceOnUse" x="0" y="0" width="64" height="64">
      <rect width="64" height="64" fill="#fff"/>
      <circle cx="35.0" cy="25.2" r="5.8" fill="#000"/>
    </mask>
    <mask id="dg-under-g" maskUnits="userSpaceOnUse" x="0" y="0" width="64" height="64">
      <rect width="64" height="64" fill="#fff"/>
      <circle cx="24.0" cy="37.8" r="5.8" fill="#000"/>
    </mask>
  </defs>
  <rect width="64" height="64" rx="14" fill="url(#dg-bg)"/>
  <g fill="none" stroke="#fff" stroke-width="5.5" stroke-linecap="round" stroke-linejoin="round">
    <path mask="url(#dg-under-d)" d="M10 12V38H22A13 13 0 0 0 22 12Z"/>
    <path mask="url(#dg-under-g)" d="M46.96 29.64A13 13 0 1 0 50 38H38"/>
  </g>
</svg>
